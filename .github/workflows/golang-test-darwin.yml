name: "Darwin"

on:
  push:
    branches:
      - main
    paths-ignore:
      # A change confined to these touches no Go. paths-ignore skips the
      # workflow only when EVERY changed file matches, so a PR mixing
      # dashboard and Go still runs the full matrix -- which is what
      # keeps this safe. No Go package embeds the dashboard build, so
      # there is no path from a .tsx to a compiled binary.
      #
      # Dashboard changes are covered by .github/workflows/dashboard.yml.
      - 'dashboard/**'
      - 'docs/**'
      - '**/*.md'
      - 'brand/**'
  pull_request:
    paths-ignore:
      # A change confined to these touches no Go. paths-ignore skips the
      # workflow only when EVERY changed file matches, so a PR mixing
      # dashboard and Go still runs the full matrix -- which is what
      # keeps this safe. No Go package embeds the dashboard build, so
      # there is no path from a .tsx to a compiled binary.
      #
      # Dashboard changes are covered by .github/workflows/dashboard.yml.
      - 'dashboard/**'
      - 'docs/**'
      - '**/*.md'
      - 'brand/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || github.actor_id }}
  cancel-in-progress: true

jobs:
  test:
    name: "Client / Unit"
    runs-on: macos-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: macos-gotest-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            macos-gotest-
            macos-go-

      - name: Install libpcap
        run: brew install libpcap

      - name: Install modules
        run: go mod tidy

      - name: check git status
        run: git --no-pager diff --exit-code

      - name: Test
        run: OPENZRO_STORE_ENGINE=${{ matrix.store }} CI=true go test -tags=devcert -exec 'sudo --preserve-env=CI,OPENZRO_STORE_ENGINE' -timeout 5m -p 1 $(go list ./... | grep -v /management)

